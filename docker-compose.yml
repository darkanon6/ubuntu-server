services:
  dashboard:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: server-dashboard
    restart: always
    ports:
      - "8090:8090"
    env_file:
      - .env
    environment:
      - TTYD_URL=http://ttyd:7681
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - ttyd
    extra_hosts:
      # The host's own hostname (e.g. `myserver`) resolves to 127.0.1.1 at
      # the OS level (standard Debian/Ubuntu self-hostname convention) —
      # inside a container that's the container's own loopback, not the
      # host's, so it can't be used to reach host-published services like
      # Netdata. host-gateway is Docker's portable way to reach the host.
      - "host.docker.internal:host-gateway"

  ttyd:
    image: tsl0922/ttyd:latest
    container_name: server-dashboard-ttyd
    restart: always
    command: ["ttyd", "--base-path", "/terminal", "-W", "bash"]
    # Intentionally no `ports:` mapping — ttyd must only be reachable through
    # the dashboard container's authenticated proxy (backend/routers/terminal.py),
    # never directly. Verify this on the real server: `docker ps` should show
    # no host port bound to this container.
